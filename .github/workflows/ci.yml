name: CI

# Every job name here is a required status check on main, recorded in
# .github/required-status-checks.txt. Renaming one, or changing the test matrix,
# renames a required check: read "Required checks" in CONTRIBUTING first.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# No token by default; every job re-grants exactly the read scope it needs.
permissions: {}

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          # Pin the TOOL, not just the action that installs it: without
          # this, every run fetches whatever `just` was released last.
          just-version: "1.58.0"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Static checks only need one interpreter; the test matrix is what
          # proves the >=3.11 floor. pyright's pythonVersion is pinned to 3.11
          # regardless of the runtime here.
          python-version: "3.13"
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: uv.lock is in sync with pyproject.toml
        # Redundant with `uv sync --locked` above, which already fails on a
        # stale lock. Kept as its own step purely so the failure names the
        # cause instead of surfacing as "Sync dev dependencies" going red.
        run: uv lock --check
      - name: Lint
        run: just lint
      - name: Format check
        run: just format-check
      - name: Typecheck
        run: just typecheck
      - name: Shell gates
        run: just lint-shell

  test:
    name: Test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # One run on macOS, where most development happens, on the newest
          # interpreter. No Windows leg: every deployment is a Linux container.
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Selects the interpreter for this matrix leg via UV_PYTHON, which
          # overrides the local development default in .python-version.
          python-version: ${{ matrix.python-version }}
      - name: Sync dev dependencies
        run: uv sync --locked
      - name: Assert the interpreter matches the matrix leg
        # A mis-selected interpreter would silently test the same version
        # several times over. Fail loudly instead.
        run: uv run python -c "import sys; v='${{ matrix.python-version }}'; assert sys.version.startswith(v), f'expected {v}, got {sys.version}'; print(sys.version)"
      - name: Run tests
        run: just test

  build:
    name: Build package & image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: just build
      - name: Build the container image
        # Built, never pushed: this proves the Dockerfile still builds against
        # the locked dependencies. Nothing here publishes an image.
        run: docker build --tag investigator:ci .
