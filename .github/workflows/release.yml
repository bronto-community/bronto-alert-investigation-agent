name: Release

# Publishes the container image for a version tag, so trying the agent is a
# `docker run` rather than a `docker build`.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push to ghcr.io. Docker Hub uses its own token.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the next step can see whether main contains the
          # tagged commit. A shallow clone has no ancestry to check.
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is on main
        # Only reviewed code gets published. main takes changes only through
        # a pull request, but a tag can point at any commit, such as one
        # pushed to a branch and never merged.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi

      - name: Tag matches the code
        # A tag cut without a version bump would publish an image whose
        # package metadata disagrees with its tag.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          PACKAGE="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/investigator/__init__.py)"
          if [ "$TAG" != "$PYPROJECT" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml (${PYPROJECT}) and __version__ (${PACKAGE})"
            exit 1
          fi

      - name: Set image metadata
        id: meta
        env:
          # Only checked for presence, never printed: Docker Hub is skipped
          # while the token isn't available to this repo.
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Every tag goes to each registry; the one build pushes the same
          # digest (and attestations) everywhere.
          IMAGES="ghcr.io/bronto-community/bronto-alert-investigation-agent"
          DOCKERHUB=false
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            # Docker Hub namespaces are Docker Hub accounts, not GitHub orgs:
            # the image lives under the brontoio account.
            IMAGES="${IMAGES} docker.io/brontoio/bronto-alert-investigation-agent"
            DOCKERHUB=true
          else
            echo "::notice::DOCKERHUB_TOKEN is not set; publishing to ghcr.io only."
          fi
          TAGS=""
          for image in $IMAGES; do
            TAGS="${TAGS}${image}:${VERSION}"$'\n'
            # Only stable releases (no pre-release suffix like -rc.1) move :latest.
            case "$GITHUB_REF_NAME" in
              *-*) ;;
              *) TAGS="${TAGS}${image}:latest"$'\n' ;;
            esac
          done
          {
            echo "dockerhub=${DOCKERHUB}"
            echo "version=${VERSION}"
            echo "tags<<TAGS_$GITHUB_SHA"
            echo "$TAGS"
            echo "TAGS_$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      # arm64 is emulated, so Apple Silicon users get a native image without a
      # second runner and a manifest merge.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub: the shared brontoio account's Read & Write token, stored as
      # org secrets shared with this repo, the same ones bronto-cli uses.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.meta.outputs.dockerhub == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The source label is what links the ghcr.io package to this repo.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Smoke test the pushed image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker run --rm "ghcr.io/bronto-community/bronto-alert-investigation-agent:${VERSION}" investigator --help
