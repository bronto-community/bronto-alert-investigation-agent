# Dependabot maintains the things this repository pins and would otherwise never
# revisit: third-party action SHAs, uv.lock and the Dockerfile's base images.
version: 2
updates:
  # Every action is pinned to a commit SHA, which is correct and unmaintainable
  # by hand — a pinned SHA never receives a security fix unless something bumps
  # it. Dependabot rewrites both the SHA and its trailing `# vX.Y.Z` comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # One pull request a week rather than five. If the batch goes red, the
      # checks name which action did it.
      actions:
        patterns: ["*"]

  # `uv`, not `pip`: a pip-ecosystem update would edit pyproject.toml and leave
  # uv.lock untouched, and every job runs `uv sync --locked`, so the pull
  # request would fail on arrival.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Update uv.lock only; never rewrite the ranges in pyproject.toml. Some of
    # those ranges are caps with a reason written next to them (`mcp<2`), and
    # widening one is a deliberate decision, not Dependabot's to make.
    versioning-strategy: lockfile-only
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Grouped by name, not by `dependency-type: development`: Dependabot's uv
      # support reports everything as a production dependency, including PEP 735
      # [dependency-groups], so a dependency-type filter would match nothing.
      dev-tooling:
        patterns: ["ruff", "pyright", "pytest*", "pyyaml"]
      langchain:
        patterns: ["langchain*", "langgraph*"]
      opentelemetry:
        patterns: ["opentelemetry-*"]

  # The build and runtime stages of the Dockerfile. Tag bumps only; the images
  # are not digest-pinned.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
    groups:
      base-images:
        patterns: ["*"]
